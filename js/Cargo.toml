[package]
name = "mxs-js"
version = "0.1.0"
edition = "2024"
description = "mxs as WebAssembly for the mxs npm package, with no imports and no tables compiled in"
license = "MIT"
publish = false

[lib]
name = "mxs"
crate-type = ["cdylib"]

[dependencies]
engine = { package = "mxs", path = "..", default-features = false }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
