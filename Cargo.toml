[package]
name = "mxs"
version = "0.4.1"
edition = "2024"
description = "A sound engine on FunDSP, with synths fitted to recordings of real instruments"
license = "MIT"
repository = "https://github.com/mx-music/mxs"
exclude = [".cargo", "python", "js"]

[dependencies]
claxon = "0.4"
cpal = "0.18.2"
fundsp = "0.23.0"
hound = "3.5.1"
midir = { version = "0.11.1", optional = true }
rtrb = "0.4"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
stacker = "0.1.25"

[features]
default = ["tables"]
# The measured tables of the instruments fitted to recordings, compiled in; without it a program loads them with synths::load_table.
tables = []
keys = ["dep:midir"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[[bin]]
name = "keys"
required-features = ["keys"]

[[example]]
name = "virtual_keyboard"
required-features = ["keys"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
