[package]
name = "mxs"
version = "0.1.0"
edition = "2024"
description = "A sound engine on FunDSP, with 88 synths and 17 effects"
license = "MIT"
repository = "https://github.com/mx-music/mxs"

[dependencies]
claxon = "0.4"
cpal = "0.18.2"
fundsp = "0.23.0"
hound = "3.5.1"
midir = { version = "0.11.1", optional = true }
rtrb = "0.4"
stacker = "0.1.25"

[features]
keys = ["dep:midir"]

[[bin]]
name = "keys"
required-features = ["keys"]

[[example]]
name = "virtual_keyboard"
required-features = ["keys"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
