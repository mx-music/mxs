[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mxs-audio"
version = "0.7.3"
description = "A sound engine with synths fitted to recordings of real instruments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/mx-music/mxs"

[tool.maturin]
module-name = "mxs._mxs"
python-source = "."
include = ["mxs/*.py"]
