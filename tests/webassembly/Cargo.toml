[package]
name = "mxs_webassembly_check"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["tables"]
tables = ["mxs/tables"]

[dependencies]
mxs = { path = "../..", default-features = false }
hound = "3.5.1"

[profile.release]
panic = "abort"
strip = true

[workspace]
